plugins {
    id 'com.android.application'
}

android {
    namespace 'com.raidenclone.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.raidenclone.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'META-INF/robovm/ios/robovm.xml'
    }
}

// Ensure core module is built before Android compilation
afterEvaluate {
    tasks.named('compileDebugJavaWithJavac') {
        dependsOn project(':core').tasks.named('compileJava')
    }
    tasks.named('compileReleaseJavaWithJavac') {
        dependsOn project(':core').tasks.named('compileJava')
    }
}

dependencies {
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
}